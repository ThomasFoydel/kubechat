name: Deploy API to OKE

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest

    env:
      OKE_API_ENDPOINT: ${{ secrets.OKE_API_ENDPOINT }}
      OKE_CA_CERTIFICATE: ${{ secrets.OKE_CA_CERTIFICATE }}
      OKE_TOKEN: ${{ secrets.OKE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl
        run: |
          echo "$OKE_CA_CERTIFICATE" | base64 --decode > /tmp/oke-ca.crt

          kubectl config set-cluster kubechat \
            --server="$OKE_API_ENDPOINT" \
            --certificate-authority=/tmp/oke-ca.crt

          kubectl config set-credentials github-actions \
            --token="$OKE_TOKEN"

          kubectl config set-context kubechat \
            --cluster=kubechat \
            --user=github-actions \
            --namespace=default

          kubectl config use-context kubechat

      - name: Verify Kubernetes access
        run: |
          kubectl auth can-i get deployments
          kubectl auth can-i patch deployments
          kubectl auth can-i create jobs
          kubectl auth can-i get jobs
          kubectl auth can-i delete jobs

      - name: Run database migrations
        run: |
          kubectl delete job kubechat-api-migrations --ignore-not-found

          sed \
            "s|MIGRATION_IMAGE|ghcr.io/thomasfoydel/kubechat-api:${{ github.sha }}|" \
            k8s/migrations/job.yaml \
            | kubectl apply -f -

          kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            job/kubechat-api-migrations

      - name: Deploy API
        run: |
          kubectl set image deployment/kubechat-api \
            api=ghcr.io/thomasfoydel/kubechat-api:${{ github.sha }}

          kubectl rollout status deployment/kubechat-api