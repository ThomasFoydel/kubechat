name: Deploy to OKE

on:
  push:
    branches:
      - master
      - staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set frontend environment
        id: frontend-env
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "api_url=https://kubechat-staging.duckdns.org" >> "$GITHUB_OUTPUT"
            echo "ws_url=wss://kubechat-staging.duckdns.org/ws" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://kubechat.duckdns.org" >> "$GITHUB_OUTPUT"
            echo "ws_url=wss://kubechat.duckdns.org/ws" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./api/Dockerfile
          push: true
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/test
          tags: |
            ghcr.io/thomasfoydel/kubechat-api:${{ github.sha }}
            ghcr.io/thomasfoydel/kubechat-api:${{ github.ref_name }}
            ${{ github.ref_name == 'master' && 'ghcr.io/thomasfoydel/kubechat-api:latest' || '' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.frontend-env.outputs.api_url }}
            NEXT_PUBLIC_WS_URL=${{ steps.frontend-env.outputs.ws_url }}
          tags: |
            ghcr.io/thomasfoydel/kubechat-frontend:${{ github.sha }}
            ghcr.io/thomasfoydel/kubechat-frontend:${{ github.ref_name }}
            ${{ github.ref_name == 'master' && 'ghcr.io/thomasfoydel/kubechat-frontend:latest' || '' }}

  deploy:
    name: Deploy to OKE
    runs-on: ubuntu-latest
    needs: build-and-push

    env:
      OKE_API_ENDPOINT: ${{ secrets.OKE_API_ENDPOINT }}
      OKE_CA_CERTIFICATE: ${{ secrets.OKE_CA_CERTIFICATE }}
      OKE_TOKEN: ${{ secrets.OKE_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure kubectl
        run: |
          echo "$OKE_CA_CERTIFICATE" | base64 --decode > /tmp/oke-ca.crt

          kubectl config set-cluster kubechat \
            --server="$OKE_API_ENDPOINT" \
            --certificate-authority=/tmp/oke-ca.crt

          kubectl config set-credentials github-actions \
            --token="$OKE_TOKEN"

          kubectl config set-context kubechat \
            --cluster=kubechat \
            --user=github-actions

          kubectl config use-context kubechat

      - name: Set deployment namespace
        id: deployment
        run: |
          if [ "${GITHUB_REF_NAME}" = "staging" ]; then
            echo "namespace=staging" >> "$GITHUB_OUTPUT"
          else
            echo "namespace=default" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify Kubernetes access
        run: |
          kubectl auth can-i get deployments -n ${{ steps.deployment.outputs.namespace }}
          kubectl auth can-i patch deployments -n ${{ steps.deployment.outputs.namespace }}
          kubectl auth can-i create jobs -n ${{ steps.deployment.outputs.namespace }}
          kubectl auth can-i get jobs -n ${{ steps.deployment.outputs.namespace }}
          kubectl auth can-i delete jobs -n ${{ steps.deployment.outputs.namespace }}

      - name: Run database migrations
        run: |
          kubectl delete job kubechat-api-migrations \
            -n ${{ steps.deployment.outputs.namespace }} \
            --ignore-not-found

          sed \
            "s|MIGRATION_IMAGE|ghcr.io/thomasfoydel/kubechat-api:${{ github.sha }}|" \
            k8s/migrations/job.yaml \
            | kubectl apply -n ${{ steps.deployment.outputs.namespace }} -f -

          kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            -n ${{ steps.deployment.outputs.namespace }} \
            job/kubechat-api-migrations

      - name: Deploy API
        run: |
          kubectl set image \
            deployment/kubechat-api \
            api=ghcr.io/thomasfoydel/kubechat-api:${{ github.sha }} \
            -n ${{ steps.deployment.outputs.namespace }}

          kubectl rollout status \
            deployment/kubechat-api \
            -n ${{ steps.deployment.outputs.namespace }}

      - name: Deploy frontend
        run: |
          kubectl set image \
            deployment/kubechat-frontend \
            frontend=ghcr.io/thomasfoydel/kubechat-frontend:${{ github.sha }} \
            -n ${{ steps.deployment.outputs.namespace }}

          kubectl rollout status \
            deployment/kubechat-frontend \
            -n ${{ steps.deployment.outputs.namespace }}
