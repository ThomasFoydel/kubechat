apiVersion: batch/v1
kind: Job
metadata:
  name: kubechat-api-migrations
  namespace: default
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrations
          image: MIGRATION_IMAGE
          envFrom:
            - secretRef:
                name: kubechat-api-secrets
          command:
            - /bin/sh
            - -c
            - npx prisma migrate deploy