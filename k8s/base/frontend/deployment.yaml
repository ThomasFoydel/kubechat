apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubechat-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubechat-frontend
  template:
    metadata:
      labels:
        app: kubechat-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/thomasfoydel/kubechat-frontend:latest

          ports:
            - containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 20
